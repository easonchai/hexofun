[package]
name = "hex_vault"
version = "0.1.0"
description = "HexVault no-loss lottery with zero-sum hex rounds"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "hex_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Localnet only: compiles in `test_fulfill`, which fabricates a fulfilled
# randomness account so the suite needs no ORAO deployment.
test-vrf = []
# Localnet only: backs the venue module with a stub reserve and compiles in
# `test_venue_init`, `test_set_venue_rate` and `test_sync`, so the suite needs
# no klend. `lib.rs` refuses it together with `staging` or `mainnet`.
test-venue = []
# One program ID per environment (ops-and-envs ticket 06): `declare_id!` in
# lib.rs picks the dev, staging or mainnet keypair off these. Default (no
# feature) is dev. `scripts/check-deployable.sh` refuses `test-vrf` combined
# with either, and refuses `staging` combined with `mainnet`.
staging = []
mainnet = []
# A second devnet ID for a fresh dev deploy that leaves the original dev
# program (and the pools on it) untouched.
devnew = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token_2022"] }
solana-keccak-hasher = "2.2.1"
solana-sha256-hasher = "2.2.1"
# Anchor's `#[account(zero_copy)]` (the Weight tree, yield-claimer ticket 04)
# derives bytemuck's Pod and Zeroable by path, so the crate must name it.
# Already in the lockfile through anchor-lang.
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
# ops-and-envs ticket 12: embeds a security.txt ELF section so researchers
# can find a contact from the deployed program address. No default features:
# the `parser` feature (thiserror + memchr) is only needed to read one back.
solana-security-txt = "1.1.3"
# yield-claimer ticket 12: Kamino's published instruction builders and zero-copy
# `Reserve`, BUSL-1.1 with a grant for use as an unmodified dependency. Needs
# `cargo update fixed --precise 1.30.0` (1.31 wants rustc 1.93, platform-tools
# ships 1.89); Cargo.lock pins it. Its `Pubkey` and `Instruction` are
# solana-pubkey 2.x types, so `klend.rs` rebuilds them from bytes before CPI.
klend-interface = "0.6.0"

[dev-dependencies]
bytemuck = "1"
