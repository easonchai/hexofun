# Postgres + backend for the VPS. Traefik is already running on the host and is
# not part of this file; it only needs the labels below and a shared network.
# Every deployment-specific value comes from .env (see .env.example).
#
# Two stacks run from this one file on the same box. Devnet is the default and
# needs no variables set. Mainnet passes its own env file, which carries
# COMPOSE_PROJECT_NAME, STACK_NAME and ENV_FILE:
#
#   docker compose --env-file .env.mainnet up -d --build
#
# COMPOSE_PROJECT_NAME separates the project, containers and volumes, STACK_NAME
# the Traefik router and service, ENV_FILE the backend's own environment.
# Compose interpolates only from the shell and --env-file, never from env_file
# below, so those three have to be in the file --env-file names.
name: ${COMPOSE_PROJECT_NAME:-hexvault}

networks:
  # The network Traefik already watches. Created outside this file.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No ports: 5432 stays off the host. Reach it with `docker compose exec postgres psql`.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    # Build context is the repo root; the Dockerfile needs the workspace lockfile.
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # RPC_URL, PROGRAM_ID, POOL_ID, OPERATOR_KEYPAIR, ADMIN_ADDRESS, ACCEPTED_MINT,
    # CORS_ORIGIN
    # and the tuning values all come from here.
    env_file: ${ENV_FILE:-.env}
    environment:
      # Overrides whatever .env holds: inside compose the database is a service name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Pinned because the Traefik service label below hardcodes 8080.
      PORT: 8080
    networks:
      - default
      - traefik
    # List form, not the mapping form: compose interpolates label values but not
    # label keys, and ${STACK_NAME} sits in the key half of the router names.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${STACK_NAME:-hexvault}-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.${STACK_NAME:-hexvault}-api.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME:-hexvault}-api.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.${STACK_NAME:-hexvault}-api.loadbalancer.server.port=8080"
      # ticket 13 (beta-launch-fixes): config only, not applied here. The
      # backend's own ThrottlerModule (api.module.ts) already covers the
      # faucet, access and referral-apply routes; a Traefik rate-limit
      # middleware in front additionally covers the polled read routes
      # (`/pool`, `/state`, `/status`, ...), which the backend leaves
      # unthrottled on purpose since the frontend polls them every 2s. To
      # apply one, uncomment and attach it to the router above with a
      # `traefik.http.routers.<name>-api.middlewares=` label:
      # - "traefik.http.middlewares.${STACK_NAME:-hexvault}-api-ratelimit.ratelimit.average=20"
      # - "traefik.http.middlewares.${STACK_NAME:-hexvault}-api-ratelimit.ratelimit.burst=40"
      # - "traefik.http.routers.${STACK_NAME:-hexvault}-api.middlewares=${STACK_NAME:-hexvault}-api-ratelimit"
